# Receta para Render: crea el servidor del formulario con un solo paso.
# Las llaves NO van aquí: Render las pide en su página.
services:
  - type: web
    name: rebajitas-cod
    runtime: python
    plan: starter            # US$ 7/mes: siempre encendido. El gratis se duerme y el cliente esperaría casi 1 minuto.
    region: virginia
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /salud
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: HOST
        value: 0.0.0.0
      - key: MODO_PRUEBA       # "0" = crea pedidos reales
        value: "1"
      - key: SHOPIFY_TIENDA    # dirección interna de la tienda en Shopify
        value: e1bvrm-ze.myshopify.com
      - key: SHOPIFY_CLIENT_ID      # "ID de cliente" de la app en dev.shopify.com
        sync: false
      - key: SHOPIFY_CLIENT_SECRET  # "Secreto del cliente" de la app en dev.shopify.com
        sync: false
      - key: TIENDA_ORIGENES   # direcciones de la tienda autorizadas a enviar el formulario
        value: https://rebajitasve.com,https://www.rebajitasve.com,https://e1bvrm-ze.myshopify.com
